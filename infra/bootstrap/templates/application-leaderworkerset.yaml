---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: leaderworkerset
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: openshift-lws-operator
  project: default
  sources:
  - path: charts/install-operators
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: da65e1611788615f969a684d90ee62bccb25c60d
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
