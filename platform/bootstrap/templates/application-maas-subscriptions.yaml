---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maas-subscriptions
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: models-as-a-service
  project: default
  sources:
  - path: charts/maas-subscriptions
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: cf20637d160f13e8f343070809d53b9cbb9e21ec
    helm:
      valueFiles:
        - $values/platform/maas-subscriptions/values.yaml
  - repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - kind: Group
      group: user.openshift.io
      jsonPointers:
        - /users
