---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app
  labels:
    app: demo-app
data:
  demo-app.py: |
    """demo-app: simple uptime monitor for the workshop API."""
    import os
    import sys
    import time
    import urllib.request

    API_URL = os.environ.get("API_URL")

    def main():
        print("demo-app starting…", flush=True)
        if not API_URL:
            print(
                "FATAL: required environment variable API_URL is not set — "
                "demo-app cannot monitor the API health endpoint without it. "
                "Expected: API_URL=https://<api-host>",
                file=sys.stderr,
                flush=True,
            )
            sys.exit(1)
        while True:
            try:
                with urllib.request.urlopen(f"{API_URL}/v1/health", timeout=5) as resp:
                    print(f"OK: /v1/health returned {resp.status}", flush=True)
            except Exception as exc:
                print(f"FAILED: /v1/health check error: {exc}", flush=True)
            time.sleep(10)

    if __name__ == "__main__":
        main()
