---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: selfsigned-ca-clusterissuer
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
  project: default
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: infra/selfsigned-ca-clusterissuer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
