---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: charts/monitoring
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: 44eb40ab957b99a3cc73a856d6116bf12900ac12
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
