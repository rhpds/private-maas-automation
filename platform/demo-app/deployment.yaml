---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      restartPolicy: Always
      containers:
        - name: demo-app
          image: registry.access.redhat.com/ubi9/python-311:1
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /opt/demo-app/demo-app.py
          securityContext:
            runAsNonRoot: true
          volumeMounts:
            - name: demo-app-script
              mountPath: /opt/demo-app
      volumes:
        - name: demo-app-script
          configMap:
            name: demo-app
