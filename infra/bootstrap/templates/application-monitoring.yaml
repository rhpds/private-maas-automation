---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: charts/monitoring
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: 2f0b50f4eed0b69887ac1786cfe5cd750892599a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
