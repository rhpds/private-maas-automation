---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhcl
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kuadrant-system
    name: in-cluster
  project: default
  source:
    path: charts/rhcl
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: cf20637d160f13e8f343070809d53b9cbb9e21ec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
