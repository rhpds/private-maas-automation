---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nemotron-3-nano
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - path: charts/llmisvc
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: cf20637d160f13e8f343070809d53b9cbb9e21ec
    helm:
      valueFiles:
        - $values/platform/models/nemotron-3-nano-30b-a3b.yaml
  - repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    ref: values
  destination:
    name: in-cluster
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
