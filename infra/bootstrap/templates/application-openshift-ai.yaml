---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openshift-ai
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: redhat-ods-operator
  project: default
  sources:
  - path: charts/openshift-ai
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: defdb66654b8a072a17a25eef819bbb5b6ad8133
    helm:
      valueFiles:
        - $values/infra/openshift-ai/values.yaml
      valuesObject:
        gateways:
          openshiftAiInference:
            hostname: inference.{{ .Values.deployer.domain }}
            certificate:
              clusterIssuer: letsencrypt-production-aws-fallback
          maasDefaultGateway:
            hostname: maas.{{ .Values.deployer.domain }}
            certificate:
              clusterIssuer: letsencrypt-production-aws-fallback
  - repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
