{{- if .Values.rocketchat.enabled }}
---
# ServiceAccount for the job to create secrets
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rocketchat-setup
  labels:
    app.kubernetes.io/part-of: rocketchat
    app.kubernetes.io/component: user-setup
---
# Role to create/update secrets in tenant namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rocketchat-setup
  namespace: {{ .Values.namespacePrefix }}-{{ .Values.tenant.username }}
  labels:
    app.kubernetes.io/part-of: rocketchat
    app.kubernetes.io/component: user-setup
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "update", "patch"]
---
# RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rocketchat-setup
  namespace: {{ .Values.namespacePrefix }}-{{ .Values.tenant.username }}
  labels:
    app.kubernetes.io/part-of: rocketchat
    app.kubernetes.io/component: user-setup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rocketchat-setup
subjects:
- kind: ServiceAccount
  name: rocketchat-setup
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-setup-script
data:
{{ (.Files.Glob "files/rocketchat-setup*").AsConfig | indent 2 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rocketchat-setup-env
data:
  RC_URL: {{ .Values.rocketchat.url | quote }}
  ADMIN_USER: {{ .Values.rocketchat.adminUsername | quote }}
  TENANT_USERNAME: {{ .Values.tenant.username | quote }}
  TENANT_NAME: {{ .Values.rocketchat.tenantDisplayName | default .Values.tenant.username | quote }}
  TENANT_EMAIL: {{ .Values.rocketchat.tenantEmail | default (printf "%s@%s" .Values.tenant.username .Values.tenant.domain) | quote }}
  OUTPUT_SECRET_NAME: {{ .Values.rocketchat.outputSecretName | default "rocketchat-user-credentials" | quote }}
  NAMESPACE: {{ printf "%s-%s" .Values.namespacePrefix .Values.tenant.username | quote }}
---
# Job to create tenant user and token
apiVersion: batch/v1
kind: Job
metadata:
  name: rocketchat-setup
  labels:
    app.kubernetes.io/part-of: rocketchat
    app.kubernetes.io/component: user-setup
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: rocketchat-setup
      containers:
      - name: setup-tenant-user
        image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
        envFrom:
        - configMapRef:
            name: rocketchat-setup-env
        env:
        - name: ADMIN_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "workspace.rocketchat.secretName" . }}
              key: admin-password
        - name: TENANT_PASS
          valueFrom:
            secretKeyRef:
              name: {{ include "workspace.rocketchat.secretName" . }}
              key: tenant-password
        command:
        - /app/rocketchat-setup.sh
        args: []
        volumeMounts:
        - name: rocketchat-setup-script
          mountPath: /app
      volumes:
      - name: rocketchat-setup-script
        configMap:
          name: rocketchat-setup-script
          defaultMode: 493

{{- end }}
