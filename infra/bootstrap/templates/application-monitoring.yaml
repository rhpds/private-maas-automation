---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: charts/monitoring
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: f6beed4b481d5345397fdbd8f6749c846181ee1e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
