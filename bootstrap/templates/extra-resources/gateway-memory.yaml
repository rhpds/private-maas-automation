---
# Single shared ConfigMap for maas-default-gateway and openshift-ai-inference.
# Kuadrant's auth/rate-limit/token-rate-limit Wasm plugins require more memory
# than Istio's default 1Gi at gateway startup. 4Gi covers all three plugins.
# Changing memory here takes effect on the next Istio Gateway reconciliation.
apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-gateway-options
  namespace: openshift-ingress
data:
  deployment: |
    spec:
      template:
        spec:
          containers:
          - name: istio-proxy
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "2"
                memory: 4Gi
---
# RBAC for the PostSync job below.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patch-gateway-memory
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: patch-gateway-memory
rules:
- apiGroups: [gateway.networking.k8s.io]
  resources: [gateways]
  verbs: [get, list, patch, update]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: patch-gateway-memory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patch-gateway-memory
subjects:
- kind: ServiceAccount
  name: patch-gateway-memory
  namespace: openshift-gitops
---
# PostSync job — runs after every sync:
#
# 1. maas-default-gateway + openshift-ai-inference: point infrastructure.parametersRef
#    at the shared maas-gateway-options CM. Istio reads this as a strategic merge
#    patch on the generated Deployment and sets the istio-proxy resource limits.
#    This approach survives Istio reconciliation (unlike direct Deployment patches).
#
# 2. data-science-gateway: the RHOAI GatewayConfig operator owns this Gateway CR
#    and reverts any parametersRef change back to data-science-gateway-config.
#    Instead we patch the deployment key of that RHOAI-managed ConfigMap directly —
#    RHOAI only manages the service key, so the deployment key persists.
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-gateway-memory
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: patch-gateway-memory
      restartPolicy: OnFailure
      containers:
      - name: patch
        image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "Waiting for gateways to exist..."
          for gw in maas-default-gateway openshift-ai-inference data-science-gateway; do
            until oc get gateway "$gw" -n openshift-ingress &>/dev/null; do
              echo "  waiting for $gw..."; sleep 10
            done
          done

          echo "Pointing maas-default-gateway and openshift-ai-inference at shared ConfigMap..."
          for gw in maas-default-gateway openshift-ai-inference; do
            oc patch gateway "$gw" -n openshift-ingress --type=merge -p \
              '{"spec":{"infrastructure":{"parametersRef":{"group":"","kind":"ConfigMap","name":"maas-gateway-options"}}}}'
          done

          echo "Patching data-science-gateway-config deployment key (RHOAI owns the gateway CR)..."
          oc patch configmap data-science-gateway-config -n openshift-ingress --type=merge -p \
            '{"data":{"deployment":"spec:\n  template:\n    spec:\n      containers:\n      - name: istio-proxy\n        resources:\n          requests:\n            cpu: 100m\n            memory: 256Mi\n          limits:\n            cpu: \"2\"\n            memory: 4Gi\n"}}'

          echo "Done."
