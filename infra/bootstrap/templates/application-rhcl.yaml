---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhcl
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: kuadrant-system
    name: in-cluster
  project: default
  sources:
  - path: charts/rhcl
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: f6401ca17fa84f9c8013feabd8f970d944330a4d
    helm:
      valueFiles:
        - $values/infra/rhcl/values.yaml
  - repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
