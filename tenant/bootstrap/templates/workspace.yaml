---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workspace-{{ .Values.tenant.username }}
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.bootstrap.repoURL }}
    targetRevision: {{ .Values.bootstrap.targetRevision }}
    path: tenant/workspace
    helm:
      valuesObject:
        namespacePrefix: {{ .Values.workspaceNamespacePrefix }}
        tenant:
          username: {{ .Values.tenant.username }}
          domain: {{ .Values.tenant.domain }}
          tier: {{ .Values.tenant.tier }}
        rocketchat:
          adminPassword: {{ .Values.rocketchat.adminPassword | quote }}
          # Use tenant password for RocketChat login
          tenantPassword: {{ .Values.tenant.password | quote }}
  destination:
    name: in-cluster
    namespace: {{ .Values.tenant.username }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace={{ .Values.bootstrap.createNamespace }}
      - RespectIgnoreDifferences=true
    {{- if .Values.bootstrap.createNamespace }}
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
        opendatahub.io/dashboard: "true"
    {{- end }}
  ignoreDifferences:
    - kind: DevWorkspace
      group: workspace.devfile.io
      jsonPointers:
        - /spec/started
    - kind: Secret
      name: {{ .Values.tenant.username }}-rocketchat-credentials
      jsonPointers:
        - /data/admin-password
