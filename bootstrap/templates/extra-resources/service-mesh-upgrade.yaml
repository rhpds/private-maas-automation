---
# Approves the Service Mesh 3.x upgrade install plan automatically after bootstrap.
# The SM subscription is created by the OpenShift ingress operator (when the
# openshift-default GatewayClass is installed). It starts on v3.1.0 with Manual
# approval, so newer versions that are compatible with RHCL 1.4.0+ need explicit
# approval. This job handles that automatically on every sync.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: approve-sm-upgrade
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: approve-sm-upgrade
rules:
- apiGroups: [operators.coreos.com]
  resources: [installplans, subscriptions]
  verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: approve-sm-upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: approve-sm-upgrade
subjects:
- kind: ServiceAccount
  name: approve-sm-upgrade
  namespace: openshift-gitops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-sm-upgrade
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: approve-sm-upgrade
      restartPolicy: OnFailure
      containers:
      - name: approve
        image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          echo "Waiting for Service Mesh subscription to exist..."
          until oc get subscription servicemeshoperator3 -n openshift-operators &>/dev/null; do
            echo "  waiting..."; sleep 10
          done

          echo "Approving any pending Service Mesh install plans..."
          for plan in $(oc get installplan -n openshift-operators \
              -o jsonpath='{.items[?(@.spec.approved==false)].metadata.name}'); do
            # Only approve SM install plans
            if oc get installplan "$plan" -n openshift-operators \
                -o jsonpath='{.spec.clusterServiceVersionNames}' | grep -q servicemeshoperator3; then
              echo "  Approving installplan: $plan"
              oc patch installplan "$plan" -n openshift-operators \
                --type=merge -p '{"spec":{"approved":true}}'
            fi
          done
          echo "Done."
