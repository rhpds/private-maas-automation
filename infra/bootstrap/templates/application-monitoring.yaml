---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    name: in-cluster
    namespace: default
  project: default
  source:
    path: charts/monitoring
    repoURL: https://github.com/jharmison-redhat/openshift-setup
    targetRevision: 98b94f4694d0e71eca743228066ccf9b8c6fe1ca
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
